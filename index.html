<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Our World ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #2a0015, #000);
        }

        .card {
            width: 350px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            box-shadow: 0 0 30px rgba(255,0,100,0.3);
        }

        h1 {
            color: white;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(90deg,#ff5c8a,#ff2e63);
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

<div class="card">
    <h1>❤️ Access Our World ❤️</h1>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Unlock Surprise 🎁</button>
</div>

<script>
function login() {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;

    if(user === "hername" && pass === "birthday") {
        window.location.href = "tree.html";
    } else {
        alert("Wrong password ❤️");
    }
}
</script>

</body>
</html>
