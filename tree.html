<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy Birthday ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    background:linear-gradient(#081229,#1d3557);
    overflow:hidden;
}

.message{
    position:absolute;
    top:40px;
    width:100%;
    text-align:center;
    color:white;
    font-size:40px;
}

.tree{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
}

.trunk{
    width:40px;
    height:200px;
    background:#6b3f1d;
    margin:auto;
}

.leaf1,.leaf2,.leaf3{
    width:0;
    height:0;
    border-left:120px solid transparent;
    border-right:120px solid transparent;
    border-bottom:160px solid #2ecc71;
    margin:auto;
}

.leaf2{
    margin-top:-70px;
}

.leaf3{
    margin-top:-70px;
}
</style>
</head>

<body>

<div class="message">
    Happy Birthday ❤️
</div>

<div class="tree">
    <div class="leaf3"></div>
    <div class="leaf2"></div>
    <div class="leaf1"></div>
    <div class="trunk"></div>
</div>

</body>
</html>
